<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо рандомизации</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.container {
    width: 500px;
    height: 500px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.result-container {
    width: 100%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#resultText {
    font-size: 1.2rem;
    font-weight: 600;
    transition: all 0.3s ease;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.arrow {
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    color: #667eea;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

.wheel-container {
    width: 400px;
    height: 400px;
    margin-bottom: 20px;
    cursor: pointer;
    position: relative;
}

#wheelCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
}

.wheel-container:hover #wheelCanvas {
    transform: scale(1.02);
}

.spin-btn {
    background: linear-gradient(135deg, #FF5722, #E64A19);
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 8px rgba(231, 76, 60, 0.3);
}

.spin-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(231, 76, 60, 0.4);
}

.spin-btn:active {
    transform: translateY(0);
}

.spin-btn svg {
    animation: spin 2s linear infinite;
    animation-play-state: paused;
}

.spin-btn.spinning svg {
    animation-play-state: running;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Анимация для результата */
@keyframes resultPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.result-pulse {
    animation: resultPulse 0.5s ease;
}

/* Адаптивность для iframe */
@media (max-width: 520px) {
    .container {
        width: 95vw;
        height: 95vw;
        max-width: 500px;
        max-height: 500px;
        padding: 10px;
    }
    
    .wheel-container {
        width: 85vw;
        height: 85vw;
        max-width: 400px;
        max-height: 400px;
    }
    
    .result-container {
        padding: 10px;
        height: 60px;
    }
    
    #resultText {
        font-size: 1rem;
    }
}
    </style>
</head>
<body>
    <!-- Скрытое поле с вариантами (заполняется в коде) -->
    <textarea id="hiddenOptions" style="display:none;">
Как вы отдыхаете от работы и переключаетесь
Интересная книга или статья за последнее время
Необычное место которое вы посетили
Профессиональная ошибка которая многому научила
Главный тренд в нашей отрасли через пять лет
Что вас вдохновляет и заряжает энергией
Навык которым хотите овладеть в следующем году
Как изменилась ваша роль за последнее время
Самый полезный совет который вы получали
Где и как вы находите новые идеи
Что такое хорошая корпоративная культура
Пример отличного сервиса который вам запомнился
Что помогает поддерживать баланс между работой и жизнью
Какой ваш любимый инструмент для продуктивности и почему
Как вы справляетесь с прокрастинацией или выгоранием
Что вы цените в работе с коллегами больше всего
История успеха которой вы гордитесь в последнее время
Что бы вы изменили в нашем рабочем процессе если бы могли
Как вы принимаете важные решения
Какая технология удивила вас в последнее время
Полезная привычка которую вы выработали
Что такое для вас эффективная коммуникация
Как вы представляете идеальную рабочую неделю
    </textarea>
    
    <div class="container">
        <!-- Результат сверху -->
        <div class="result-container">
            <div id="resultText">Готово к запуску</div>
            <div class="arrow">▼</div>
        </div>
        
        <!-- Колесо по центру -->
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>
        
        <!-- Кнопка запуска -->
        <button style="display: none;" id="spinBtn" class="spin-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2v6h-6"></path>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                <path d="M3 22v-6h6"></path>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            Крутить колесо
        </button>
        
        <!-- Скрытый контрол для обновления при изменении вариантов -->
        <button id="updateBtn" style="display:none;">Обновить</button>
    </div>

    <script>
        class SimpleWheel {
    constructor() {
        this.canvas = document.getElementById('wheelCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.hiddenOptions = document.getElementById('hiddenOptions');
        this.resultText = document.getElementById('resultText');
        this.spinBtn = document.getElementById('spinBtn');
        this.updateBtn = document.getElementById('updateBtn');
        
        // Цвета для сегментов
        this.colors = [
            '#FF6B6B', '#4ECDC4', '#FFD166', '#06D6A0', '#118AB2',
            '#EF476F', '#7209B7', '#3A86FF', '#FB5607', '#8338EC',
            '#FF006E', '#FFBE0B', '#3A86FF', '#FB5607', '#8338EC'
        ];
        
        // Настройки вращения
        this.isSpinning = false;
        this.currentRotation = 0;
        this.spinDuration = 4000; // 4 секунды
        this.selectedSegment = null;
        
        // Инициализация
        this.init();
    }
    
    init() {
        // Загружаем варианты из скрытого поля
        this.options = this.parseOptions();
        
        // Рисуем начальное колесо
        this.drawWheel();
        
        // События
        this.spinBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.spinWheel();
        });
        
        this.canvas.addEventListener('click', () => this.spinWheel());
        
        // Если нужно обновлять варианты динамически
        this.updateBtn.addEventListener('click', () => {
            this.options = this.parseOptions();
            this.drawWheel();
        });
        
        // Запускаем анимационный цикл
        this.animate();
    }
    
    parseOptions() {
        const text = this.hiddenOptions.value.trim();
        if (!text) return ['Добавьте варианты'];
        
        return text.split('\n')
            .map(opt => opt.trim())
            .filter(opt => opt !== '')
            .map(opt => this.truncateText(opt, 20)); // Ограничиваем длину текста
    }
    
    truncateText(text, maxLength) {
        if (text.length <= maxLength) return text;
        return text.substring(0, maxLength) + '...';
    }
    
    drawWheel() {
        const width = this.canvas.width;
        const height = this.canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) / 2 - 10;
        
        this.ctx.clearRect(0, 0, width, height);
        
        if (this.options.length === 0) {
            this.drawEmptyWheel(centerX, centerY, radius);
            return;
        }
        
        const segmentAngle = (2 * Math.PI) / this.options.length;
        
        // Рисуем сегменты
        for (let i = 0; i < this.options.length; i++) {
            const startAngle = i * segmentAngle + this.currentRotation;
            const endAngle = (i + 1) * segmentAngle + this.currentRotation;
            
            // Сегмент
            this.ctx.beginPath();
            this.ctx.moveTo(centerX, centerY);
            this.ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            this.ctx.closePath();
            
            // Цвет сегмента
            const color = this.colors[i % this.colors.length];
            this.ctx.fillStyle = color;
            this.ctx.fill();
            
            // Граница сегмента
            this.ctx.strokeStyle = '#fff';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
            
            // Текст на сегменте
            this.drawSegmentText(
                this.options[i],
                centerX,
                centerY,
                radius - 30,
                startAngle + segmentAngle / 2
            );
        }
        
        // Центральный круг
        this.drawCenter(centerX, centerY);
    }
    
    drawEmptyWheel(centerX, centerY, radius) {
        this.ctx.beginPath();
        this.ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        this.ctx.fillStyle = '#f0f0f0';
        this.ctx.fill();
        this.ctx.strokeStyle = '#ddd';
        this.ctx.lineWidth = 3;
        this.ctx.stroke();
        
        this.ctx.fillStyle = '#999';
        this.ctx.font = 'bold 18px Arial';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText('Нет вариантов', centerX, centerY);
    }
    
    drawSegmentText(text, x, y, radius, angle) {
        this.ctx.save();
        this.ctx.translate(x, y);
        this.ctx.rotate(angle);
        this.ctx.textAlign = 'right';
        this.ctx.fillStyle = '#fff';
        this.ctx.font = this.getFontForText(text);
        
        // Тень для лучшей читаемости
        this.ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        this.ctx.shadowBlur = 2;
        this.ctx.shadowOffsetX = 1;
        this.ctx.shadowOffsetY = 1;
        
        this.ctx.fillText(text, radius - 15, 5);
        this.ctx.restore();
    }
    
    getFontForText(text) {
        if (text.length > 15) return 'bold 12px Arial';
        if (text.length > 10) return 'bold 14px Arial';
        return 'bold 16px Arial';
    }
    
    drawCenter(centerX, centerY) {
        // Внешний круг
        this.ctx.beginPath();
        this.ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        this.ctx.fillStyle = '#333';
        this.ctx.fill();
        
        // Внутренний круг
        this.ctx.beginPath();
        this.ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
        this.ctx.fillStyle = '#fff';
        this.ctx.fill();
        
        // Декоративные линии
        this.ctx.strokeStyle = '#fff';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4;
            const x1 = centerX + Math.cos(angle) * 10;
            const y1 = centerY + Math.sin(angle) * 10;
            const x2 = centerX + Math.cos(angle) * 20;
            const y2 = centerY + Math.sin(angle) * 20;
            this.ctx.moveTo(x1, y1);
            this.ctx.lineTo(x2, y2);
        }
        this.ctx.stroke();
    }
    
    spinWheel() {
        if (this.isSpinning || this.options.length === 0) return;
        
        this.isSpinning = true;
        this.spinBtn.classList.add('spinning');
        this.resultText.textContent = "Крутим...";
        
        // Случайное количество оборотов (3-6)
        const extraSpins = 3 + Math.random() * 3;
        const randomOffset = Math.random() * Math.PI * 2;
        this.targetRotation = this.currentRotation + Math.PI * 2 * extraSpins + randomOffset;
        this.startTime = Date.now();
        
        // Запускаем анимацию вращения
        this.animateSpin();
    }
    
    animateSpin() {
        if (!this.isSpinning) return;
        
        const now = Date.now();
        const elapsed = now - this.startTime;
        const progress = Math.min(elapsed / this.spinDuration, 1);
        
        // Easing функция для плавного замедления
        const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
        const easedProgress = easeOutCubic(progress);
        
        // Вычисляем текущее вращение
        this.currentRotation = this.currentRotation + 
            (this.targetRotation - this.currentRotation) * easedProgress * 0.05;
        
        this.drawWheel();
        
        if (progress < 1) {
            requestAnimationFrame(() => this.animateSpin());
        } else {
            this.finishSpin();
        }
    }
    
    finishSpin() {
        this.isSpinning = false;
        this.spinBtn.classList.remove('spinning');
        
        // Определяем выбранный сегмент
        const normalizedRotation = ((this.currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const segmentAngle = (2 * Math.PI) / this.options.length;
        const selectedIndex = Math.floor(
            (Math.PI * 2 - normalizedRotation + segmentAngle / 2) / segmentAngle
        ) % this.options.length;
        
        this.selectedSegment = this.options[selectedIndex];
        
        // Показываем результат с анимацией
        this.resultText.textContent = `🎯 ${this.selectedSegment}`;
        this.resultText.classList.add('result-pulse');
        
        // Убираем класс анимации после её завершения
        setTimeout(() => {
            this.resultText.classList.remove('result-pulse');
        }, 500);
        
        // Можно также отправить результат в родительское окно
        if (window.parent !== window) {
            window.parent.postMessage({
                type: 'WHEEL_RESULT',
                result: this.selectedSegment.replace('...', '')
            }, '*');
        }
    }
    
    animate() {
        // Легкая анимация покоя (медленное вращение при простое)
        if (!this.isSpinning) {
            this.currentRotation += 0.001;
            this.drawWheel();
        }
        requestAnimationFrame(() => this.animate());
    }
}

// Инициализация при загрузке
document.addEventListener('DOMContentLoaded', () => {
    const wheel = new SimpleWheel();
    
    // Экспортируем для возможного использования извне
    window.wheel = wheel;
    
    // Функция для обновления вариантов извне
    window.updateWheelOptions = function(options) {
        if (Array.isArray(options)) {
            document.getElementById('hiddenOptions').value = options.join('\n');
            wheel.options = options.map(opt => wheel.truncateText(opt, 20));
            wheel.drawWheel();
        }
    };
    
    // Функция для запуска вращения извне
    window.spinWheel = function() {
        wheel.spinWheel();
    };
});
    </script>
</body>
</html>
